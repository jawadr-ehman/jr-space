name: Update index from release asset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download temp-upload-1 --pattern jr-space.html
          mv jr-space.html index.html
          git config user.name "jawadr-ehman"
          git config user.email "jawadr-ehman@users.noreply.github.com"
          git add index.html
          git commit -m "Update JR Space: fast load, honest login buttons, password reset"
          git push
