name: tmp-rename

on:
  push:
    paths:
      - .github/workflows/tmp-rename.yml

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename jr-space.html to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f jr-space.html index.html
          git commit -m "Rename jr-space.html to index.html"
          git push
