name: tmp-rename
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename jr-space.html to index.html
        run: |
          git config user.name "jawadr-ehman"
          git config user.email "jawadr-ehman@users.noreply.github.com"
          git mv -f jr-space.html index.html
          git commit -m "Rename jr-space.html to index.html"
          git push
