name: Rename jr-space.html to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f jr-space.html index.html
          git commit -m "Update JR Space: show Name, Username, Link, Mail, Followers, Views, Engagement % for every creator"
          git push
